<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='760' height='616' font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' viewBox='0 0 760 616' role='img' aria-label='Pods are tagged by UID in the kernel, then named by a join in Thanos' font-size='11.5'><rect width='760' height='616' fill='#ffffff'/><defs><marker id='arch-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='30' font-size='15' font-weight='600' fill='#1f2328'>Pods are tagged by UID in the kernel, then named by a join in Thanos</text><g><rect x='24' y='52' width='712' height='164' rx='8' fill='none' stroke='#c4ccd4' stroke-width='1.25' stroke-dasharray='6 4'/><text x='40' y='76' font-size='13' font-weight='600' fill='#57606a'>Each labeled node · ebpf-exporter.io/enabled=true</text></g><g fill='none' stroke='#8c959f' stroke-width='1.25'><path d='M245 148H277' marker-end='url(#arch-arrow)'/><path d='M482 148H514' marker-end='url(#arch-arrow)'/><path d='M616.5 200V248' marker-end='url(#arch-arrow)'/><path d='M616 352V436H530' marker-end='url(#arch-arrow)'/><path d='M150 352V436H230' marker-end='url(#arch-arrow)'/><path d='M380 480V520' marker-end='url(#arch-arrow)'/></g><g><rect x='40' y='96' width='205' height='104' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='52' y='120' font-size='13' font-weight='600' fill='#1f2328'>Kernel hooks</text><text x='52' y='136' fill='#57606a'>sched_switch (CPU waits)</text><text x='52' y='152' fill='#57606a'>block_rq_complete (IO)</text><text x='52' y='168' fill='#57606a'>TCP tracepoints, OOM kprobe</text><text x='52' y='184' fill='#57606a'>CFS fentry, 49 Hz sampler</text></g><g><rect x='277' y='96' width='205' height='104' rx='8' fill='#0969da' fill-opacity='0.12' stroke='#0969da' stroke-width='2'/><text x='289' y='120' font-size='13' font-weight='600' fill='#1f2328'>BPF maps</text><text x='289' y='136' fill='#1f2328'>counters keyed by pod UID</text><text x='289' y='152' fill='#1f2328'>cgroup to pod UID cache</text><text x='289' y='168' fill='#1f2328'>per-CPU node histograms</text></g><g><rect x='514' y='96' width='205' height='104' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='526' y='120' font-size='13' font-weight='600' fill='#1f2328'>ebpf_exporter</text><text x='526' y='136' fill='#57606a'>DaemonSet, one pod per node</text><text x='526' y='152' fill='#57606a'>reads maps on each scrape</text><text x='526' y='168' fill='#57606a'>serves :9435/metrics</text><text x='526' y='184' fill='#57606a'>programs from a ConfigMap</text></g><text x='628' y='236' fill='#57606a'>scrape</text><g><rect x='506' y='248' width='220' height='104' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='518' y='272' font-size='13' font-weight='600' fill='#1f2328'>User-workload Prometheus</text><text x='518' y='288' fill='#57606a'>ServiceMonitor, 30 s scrape</text><text x='518' y='304' fill='#57606a'>spec.sampleLimit: 30000</text><text x='518' y='320' fill='#57606a'>recording rule + exporter</text><text x='518' y='336' fill='#57606a'>health alerts (leaf scope)</text></g><g><rect x='40' y='248' width='220' height='104' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='52' y='272' font-size='13' font-weight='600' fill='#1f2328'>Platform Prometheus</text><text x='52' y='288' fill='#57606a'>kube-state-metrics</text><text x='52' y='304' fill='#57606a'>(kube_pod_info)</text><text x='52' y='320' fill='#57606a'>cAdvisor, node-exporter</text></g><text x='573' y='426' text-anchor='middle' fill='#57606a'>query</text><text x='190' y='426' text-anchor='middle' fill='#57606a'>query</text><g><rect x='230' y='392' width='300' height='88' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='242' y='416' font-size='13' font-weight='600' fill='#1f2328'>Thanos Querier and Ruler</text><text x='242' y='432' fill='#57606a'>joins uid onto kube_pod_info</text><text x='242' y='448' fill='#57606a'>for namespace, pod and node</text><text x='242' y='464' fill='#57606a'>Ruler: exporter memory alert</text></g><text x='390' y='504' fill='#57606a'>PromQL</text><g><rect x='230' y='520' width='300' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='242' y='544' font-size='13' font-weight='600' fill='#1f2328'>Grafana</text><text x='242' y='560' fill='#57606a'>dashboard, 42 panels</text><text x='242' y='576' fill='#57606a'>filters: node, namespace, pod</text></g></svg>
