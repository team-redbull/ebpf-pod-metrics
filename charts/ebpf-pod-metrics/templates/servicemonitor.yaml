{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ebpf-pod-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebpf-pod-metrics.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: {{ include "ebpf-pod-metrics.jobLabel" . }}
  # Per-target guard: a node exposing more samples fails its scrape (EbpfExporterDown) instead of
  # flooding the TSDB. This is a spec-level field; on an endpoint it would be silently pruned.
  sampleLimit: {{ .Values.serviceMonitor.sampleLimit }}
  selector:
    matchLabels:
      {{- include "ebpf-pod-metrics.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
      {{- if or .Values.serviceMonitor.dropKernelFunctions .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- if .Values.serviceMonitor.dropKernelFunctions }}
        - sourceLabels: [__name__]
          regex: ebpf_exporter_node_kernel_function_samples_total
          action: drop
        {{- end }}
        {{- with .Values.serviceMonitor.metricRelabelings }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
