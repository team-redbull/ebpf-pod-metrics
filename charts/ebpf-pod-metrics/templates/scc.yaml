{{- if .Values.scc.create }}
# Least-privilege SCC: no privileged container, no host mounts, no hostPID/hostNetwork. Only the
# capabilities the enabled programs need, and the spc_t SELinux type (container_t is denied bpf()).
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ include "ebpf-pod-metrics.sccName" . }}
  labels:
    {{- include "ebpf-pod-metrics.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      eBPF tracing for the {{ include "ebpf-pod-metrics.fullname" . }} DaemonSet only:
      CAP_BPF/CAP_PERFMON + spc_t, no host access.
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
readOnlyRootFilesystem: false
allowedCapabilities: {{ include "ebpf-pod-metrics.capabilities" . }}
defaultAddCapabilities: null
requiredDropCapabilities: null
runAsUser:
  type: RunAsAny
# RunAsAny, not MustRunAs/spc_t: the container sets seLinuxOptions.type=spc_t itself, and SCC admission only
# defaults seLinuxOptions when the container leaves it unset, so MustRunAs rejects the pod for the empty
# MCS level (".seLinuxOptions.level: Invalid value: \"\": must be s0:cX,cY"). Only this chart's SA can use it.
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - "*"
volumes:
  - configMap
  - projected
  - emptyDir
users: []
groups: []
priority: null
{{- end }}
