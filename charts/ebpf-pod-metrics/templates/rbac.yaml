apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ebpf-pod-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebpf-pod-metrics.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ebpf-pod-metrics.fullname" . }}-scc
  labels:
    {{- include "ebpf-pod-metrics.labels" . | nindent 4 }}
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: [{{ include "ebpf-pod-metrics.sccName" . | quote }}]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ebpf-pod-metrics.fullname" . }}-scc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebpf-pod-metrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ebpf-pod-metrics.fullname" . }}-scc
subjects:
  - kind: ServiceAccount
    name: {{ include "ebpf-pod-metrics.fullname" . }}
    namespace: {{ .Release.Namespace }}
