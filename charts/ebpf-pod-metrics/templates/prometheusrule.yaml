{{- if .Values.prometheusRule.enabled }}
{{- $kernelFunctions := and (include "ebpf-pod-metrics.hasProfile" .) (not .Values.serviceMonitor.dropKernelFunctions) }}
{{- $recording := and .Values.prometheusRule.recordingRules $kernelFunctions }}
{{- $alerts := .Values.prometheusRule.alerts }}
{{- if or $recording $alerts.enabled }}
# Rules that only need this exporter's own series: evaluated in the user-workload Prometheus
# (leaf-prometheus scope), next to the data, not in Thanos Ruler.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ebpf-pod-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebpf-pod-metrics.labels" . | nindent 4 }}
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- if $recording }}
    - name: ebpf-exporter-recording
      interval: 1m
      rules:
        # Kernel CPU per node/context grouped into subsystems (slab, memcg, reclaim, locking, ...) by
        # function-name regexes. Pre-aggregated because the regex chain over every kernel-function
        # series is too slow per dashboard refresh on large clusters. Generated by tools/gen_dashboard.py.
        - record: ebpf:node_kernel_subsystem_cores:rate2m
          expr: |
            {{- .Files.Get "files/rules/kernel-subsystem.promql" | trim | nindent 12 }}
    {{- end }}
    {{- if $alerts.enabled }}
    - name: ebpf-exporter
      rules:
        - alert: EbpfExporterDown
          expr: up{job="ebpf-exporter"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: {{`ebpf-exporter on {{ $labels.node }} is not being scraped`}}
            description: {{`Includes failed scrapes from the per-target sampleLimit; check scrape_samples_scraped.`}}
        - alert: EbpfExporterProgramDetached
          expr: ebpf_exporter_ebpf_program_attached == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: {{`An eBPF program failed to attach on {{ $labels.node }} (program id {{ $labels.id }})`}}
            description: {{`Check ebpf_exporter_ebpf_program_info{id="{{ $labels.id }}"} and the pod logs; usually a kernel symbol that is inlined or renamed on this kernel.`}}
        - alert: EbpfExporterHighOverhead
          # only evaluates while sysctl kernel.bpf_stats_enabled=1 (e.g. during a canary)
          expr: |
            sum by (node) (rate(ebpf_exporter_ebpf_program_run_time_seconds[5m])) > {{ $alerts.overheadCores }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: {{`eBPF programs on {{ $labels.node }} use {{ $value | humanize }} cores`}}
            description: {{`Check the 'eBPF CPU cost by program' panel; disable the costly entry under programs in the chart values.`}}
        - alert: EbpfExporterDecoderErrors
          expr: sum by (node, config) (rate(ebpf_exporter_decoder_errors_total[15m])) > 0
          for: 15m
          labels:
            severity: info
          annotations:
            summary: {{`ebpf-exporter label decoding errors for {{ $labels.config }} on {{ $labels.node }}`}}
    {{- end }}
{{- end }}
{{- if $alerts.enabled }}
---
# Needs platform metrics (cAdvisor, kube-state-metrics), so it must NOT be leaf-prometheus scoped:
# Thanos Ruler evaluates it, with queries restricted to this namespace.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ebpf-pod-metrics.fullname" . }}-platform
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebpf-pod-metrics.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ebpf-exporter-platform
      rules:
        - alert: EbpfExporterNearMemoryLimit
          expr: |
            max by (namespace, pod) (container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}", container="ebpf-exporter"})
              / max by (namespace, pod) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}", container="ebpf-exporter", resource="memory"})
              > {{ $alerts.memoryLimitRatio }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: {{`ebpf-exporter {{ $labels.pod }} is at {{ $value | humanizePercentage }} of its memory limit`}}
            description: {{`BPF maps are charged to this container. Raise resources.limits.memory, or disable a program.`}}
{{- end }}
{{- end }}
